<!doctype html><html><head><meta charset="utf-8"><title>Subtitle Cloud Translation</title><style>body{font-family:sans-serif;margin:2em;max-width:900px}label{display:block;margin:.7em 0}input,textarea{width:100%;box-sizing:border-box;padding:.5em}textarea{min-height:90px}table{width:100%;border-collapse:collapse;margin-top:1em}th,td{padding:.45em;border-bottom:1px solid #ddd;text-align:left}.done{color:green}.failed{color:#b00}.bar{height:8px;background:#ddd}.bar>i{display:block;height:100%;background:#4185f4}</style></head>
<body><h1>Subtitle Cloud Translation</h1><label>Service URL <input id="url" value="http://127.0.0.1:8898"></label><label>API Token <input id="token" type="password"></label><label>Path mappings <textarea id="mapping" placeholder="EmbyPrefix=ServicePrefix"></textarea></label><p>媒体菜单动作“生成云字幕”提交的任务会显示在下方。</p><table><thead><tr><th>任务</th><th>状态</th><th>阶段</th><th>进度</th><th>刷新</th></tr></thead><tbody id="jobs"></tbody></table>
<script>const $=id=>document.getElementById(id);const headers=()=>{const t=$("token").value;return t?{"X-API-Token":t}:{};};async function api(path){const r=await fetch($("url").value.replace(/\/$/,"")+path,{headers:headers()});if(!r.ok)throw Error(await r.text());return r.json();}function esc(v){return String(v||"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));}function render(items){$("jobs").innerHTML=items.map(j=>{const p=Math.max(0,Math.min(100,Number(j.progress||0)));return `<tr class="${esc(j.status)}"><td>${esc(j.display_title||j.input_path)}</td><td>${esc(j.status)}</td><td>${esc(j.phase)}</td><td><div class=bar><i style="width:${p}%"></i></div>${p}%</td><td>${esc(j.refresh_state||"pending")}${j.message?`<br><small>${esc(j.message)}</small>`:""}</td></tr>`}).join("");}async function poll(){if(document.hidden)return;try{render(await api("/api/plugin/jobs"));}catch(e){console.error(e);}}poll();setInterval(poll,3000);document.addEventListener("visibilitychange",poll);</script></body></html>
